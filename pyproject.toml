[project]
name = "python-oop-fundamentals"
version = "0.1.0"
description = "Small OOP teaching project: payments, pricing strategies, and order flow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.8"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["payment", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = false
packages = ["payment"]
